name: Monthly PDF Email

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Invoice year in YYYY format. Leave empty to use the previous month."
        required: false
        type: string
      month:
        description: "Invoice month in 1-12 format. Leave empty to use the previous month."
        required: false
        type: string
  schedule:
    - cron: "47 7 6 * *" # Runs on the 6th day of every month at 07:47 UTC (09:47 in Warsaw during DST).

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  MAIL_TO: "marek.gmyrek@gmail.com"

jobs:
  build-and-send:
    name: Generate PDF And Send Email
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUESTSAGE_LOGIN: ${{ secrets.GUESTSAGE_LOGIN }}
      GUESTSAGE_PASSWORD: ${{ secrets.GUESTSAGE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Resolve invoice period
        id: period
        env:
          INPUT_YEAR: ${{ github.event.inputs.year }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          python3 <<'PY'
          import os
          from datetime import datetime, timezone

          input_year = (os.environ.get("INPUT_YEAR") or "").strip()
          input_month = (os.environ.get("INPUT_MONTH") or "").strip()

          if bool(input_year) ^ bool(input_month):
              raise SystemExit("Provide both year and month, or leave both empty.")

          if input_year and input_month:
              year = int(input_year)
              month = int(input_month)
              if month < 1 or month > 12:
                  raise SystemExit("Month input must be between 1 and 12.")
          else:
              today = datetime.now(timezone.utc).date()
              year = today.year
              month = today.month - 1
              if month == 0:
                  year -= 1
                  month = 12

          token = f"{year:04d}-{month:02d}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"year={year}\n")
              handle.write(f"month={month}\n")
              handle.write(f"period={token}\n")
              handle.write(f"pdf_path=out/topinvoice-{token}.pdf\n")
          PY

      - name: Log invoice period
        run: |
          echo "::notice title=Invoice period::${{ steps.period.outputs.period }}"
          echo "Resolved invoice year: ${{ steps.period.outputs.year }}"
          echo "Resolved invoice month: ${{ steps.period.outputs.month }}"
          echo "PDF output path: ${{ steps.period.outputs.pdf_path }}"

      - name: Check email configuration
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing secret::$name is not configured."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "SMTP configuration is present."

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Generate PDF
        run: |
          set -euo pipefail

          mkdir -p out
          echo "Generating invoice PDF for period ${{ steps.period.outputs.period }}..."
          uv run topinvoice "${{ steps.period.outputs.period }}" \
            --headless \
            --pdf-output "${{ steps.period.outputs.pdf_path }}"

      - name: Verify generated PDF
        id: pdf
        run: |
          set -euo pipefail

          pdf_path="${{ steps.period.outputs.pdf_path }}"

          if [ ! -s "$pdf_path" ]; then
            echo "::error title=PDF not found::Expected non-empty PDF at $pdf_path."
            exit 1
          fi

          pdf_size="$(stat -c%s "$pdf_path")"
          pdf_sha256="$(sha256sum "$pdf_path" | awk '{print $1}')"

          echo "Generated PDF:"
          ls -lh "$pdf_path"
          file "$pdf_path"
          echo "SHA256: $pdf_sha256"

          {
            echo "size=$pdf_size"
            echo "sha256=$pdf_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload PDF artifact
        if: ${{ always() && steps.period.outputs.pdf_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: topinvoice-${{ steps.period.outputs.period }}-pdf
          path: ${{ steps.period.outputs.pdf_path }}
          if-no-files-found: warn
          retention-days: 90

      - name: Send PDF by email
        id: send-email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Faktura Topolowa 8 m 15 - ${{ steps.period.outputs.period }}
          to: ${{ env.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || secrets.SMTP_USERNAME }}
          body: |
            W załączniku faktura PDF za okres ${{ steps.period.outputs.period }}.

            Pozdrawiam,
            ---
            Workflow: ${{ github.workflow }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: ${{ steps.period.outputs.pdf_path }}

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Monthly PDF Email"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| Period | ${{ steps.period.outputs.period || 'not resolved' }} |"
            echo "| PDF path | ${{ steps.period.outputs.pdf_path || 'not resolved' }} |"
            echo "| PDF size | ${{ steps.pdf.outputs.size || 'not available' }} bytes |"
            echo "| PDF SHA256 | ${{ steps.pdf.outputs.sha256 || 'not available' }} |"
            echo "| Artifact | topinvoice-${{ steps.period.outputs.period || 'unknown' }}-pdf |"
            echo "| Email recipient | ${{ env.MAIL_TO }} |"
            echo "| Email status | ${{ steps.send-email.outcome || 'not run' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          case "${{ steps.send-email.outcome }}" in
            success)
              echo "::notice title=Email sent::Invoice PDF was sent to ${{ env.MAIL_TO }}."
              ;;
            failure)
              echo "::error title=Email failed::Invoice PDF was generated, but sending it to ${{ env.MAIL_TO }} failed."
              ;;
            *)
              echo "::warning title=Email not sent::Email step did not complete. Check earlier workflow logs."
              ;;
          esac

      - name: Fail when email was not sent
        if: ${{ always() && steps.send-email.outcome == 'failure' }}
        run: exit 1
